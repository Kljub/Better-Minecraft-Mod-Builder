plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.modrinth.minotaur' version '2.+'
}

version = mod_version
group = group_id

base {
    archivesName = artifact_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            if (org.gradle.internal.os.OperatingSystem.current().isMacOsX())
                jvmArguments.add('-XstartOnFirstThread')
        }
    }

    mods {
        screenspec {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

// neoforge.mods.toml's ${file.jarVersion} reads this — also needed when the jar is nested
// (Jar-in-Jar) inside a mod built by the designer's "Build mod (.jar)".
jar {
    manifest {
        attributes('Implementation-Version': project.version, 'Implementation-Title': artifact_id)
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = modrinth_project_id
    versionNumber = mod_version
    versionName = "ScreenSpec ${mod_version} for MC ${minecraft_version}"
    versionType = "release"
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    changelog = System.getenv("RELEASE_NOTES") ?: ""
    syncBodyFrom = project.file("README.md").text
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            pom {
                name = 'ScreenSpec NeoForge'
                description = 'Runtime library for ScreenSpec JSON screens exported by the MC Screen Designer.'
                url = 'https://github.com/SheepFromHeaven/minecraft-mod-ui-builder'
                licenses {
                    license {
                        name = 'MIT'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/SheepFromHeaven/minecraft-mod-ui-builder")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
